server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*.log

    pipeline_stages:
      # Docker wraps logs in a JSON envelope - unwrap it first
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      - output:
          source: output
      # Parse the inner JSON that our logback-spring.xml produces
      - json:
          expressions:
            level: level
            message: message
            logger: logger
      - labels:
          stream:
          level: