groups:
  - name: ticketebi_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(app_errors_total[1m]) * 60 > 5
        for: 0m
        labels:
          severity: CRITICAL
        annotations:
          summary: "Error rate exceeded 5 per minute"
          description: "Current rate: {{ $value | printf \"%.2f\" }} errors/min"