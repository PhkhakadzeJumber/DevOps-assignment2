spring.application.name=ticketebi-backend

# Show SQL queries in the console (useful for debugging)
spring.jpa.show-sql=true

# Format the SQL queries for better readability
spring.jpa.properties.hibernate.format_sql=true

# Specify the PostgreSQL dialect (often auto-detected, but good to be explicit)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.open-in-view=false

# Logging (Optional - adjust as needed)
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# JWT
app.security.jwt.issuer=ticketebi
app.security.jwt.access-ttl-min=60
app.security.jwt.refresh-ttl-days=30
app.security.jwt.secret=${JWT_SECRET}
# QR
app.security.qr.issuer=ticketebi-qr
app.security.qr.ttl-days=30
app.security.qr.secret=${QR_SECRET}

# mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${APP_EMAIL}
spring.mail.password=${APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
app.oauth2.redirect-url=${APP_OAUTH2_REDIRECT_URL:http://localhost:3000/auth/callback}

spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# OpenAPI JSON endpoint
springdoc.api-docs.path=/api/docs

# Swagger UI endpoint
springdoc.swagger-ui.path=/api/swagger

# Serve uploaded files as static resources
spring.web.resources.static-locations=file:/app/uploads/
spring.web.resources.add-mappings=true
spring.servlet.multipart.max-file-size=5MB

# Flyway
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# Expose all actuator endpoints (simplest + safest for dev)
management.endpoints.web.exposure.include=*

# Show detailed health info
management.endpoint.health.show-details=always

# Enable Prometheus endpoint explicitly
management.endpoint.prometheus.enabled=true

